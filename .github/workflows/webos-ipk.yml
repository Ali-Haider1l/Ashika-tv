name: Ashika TV webOS IPK

on:
  push:
    branches: [main]
    paths:
      - "webos/**"
      - ".github/workflows/webos-ipk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ashika-webos-ipk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install official webOS CLI
        run: npm install --global @webos-tools/cli@3.2.6

      - name: Generate app icon
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          size = 512
          im = Image.new("RGB", (size, size))
          px = im.load()
          for y in range(size):
              for x in range(size):
                  t = (x + y) / (2 * (size - 1))
                  px[x, y] = (int(9 + 48*t), int(12 + 15*t), int(29 + 65*t))
          d = ImageDraw.Draw(im)
          d.rounded_rectangle((62, 95, 450, 395), radius=52, outline=(185, 157, 255), width=18)
          d.rounded_rectangle((88, 121, 424, 369), radius=30, fill=(28, 23, 58))
          d.ellipse((210, 172, 302, 264), fill=(237, 49, 89))
          d.polygon([(247, 193), (247, 243), (286, 218)], fill=(255,255,255))
          d.rounded_rectangle((178, 414, 334, 438), radius=12, fill=(185,157,255))
          im.save("webos/icon.png", "PNG", optimize=True)
          PY

      - name: Validate webOS app metadata
        run: |
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path("webos")
          info = json.loads((root / "appinfo.json").read_text())
          assert info["id"] and info["main"] and info["icon"]
          for key in ("main", "icon", "largeIcon"):
              assert (root / info[key]).is_file(), f"Missing {key}: {info[key]}"
          assert (root / "index.html").is_file()
          print("Validated:", info["id"], info["version"])
          PY

      - name: Package IPK
        run: |
          mkdir -p dist
          ares-config --profile tv
          ares-package --no-minify --outdir dist webos
          test -s dist/com.ashika.livetv_1.0.0_all.ipk
          ares-package --info dist/com.ashika.livetv_1.0.0_all.ipk

      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ashika-TV-webOS-IPK-v1.0.0
          path: dist/*.ipk
          retention-days: 90

      - name: Publish webOS IPK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: webos-v1.0.0
          target_commitish: main
          name: Ashika TV webOS v1.0.0
          generate_release_notes: true
          files: dist/*.ipk

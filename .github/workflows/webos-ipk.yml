name: Ashika TV webOS IPK

on:
  push:
    branches: [main]
    paths:
      - "webos/**"
      - ".github/workflows/webos-ipk.yml"
  pull_request:
    paths:
      - "webos/**"
      - ".github/workflows/webos-ipk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ashika-webos-ipk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install official webOS CLI
        run: npm install --global @webos-tools/cli@3.2.6

      - name: Generate app icon
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          size = 512
          im = Image.new("RGB", (size, size))
          px = im.load()
          for y in range(size):
              for x in range(size):
                  t = (x + y) / (2 * (size - 1))
                  px[x, y] = (int(9 + 48*t), int(12 + 15*t), int(29 + 65*t))
          d = ImageDraw.Draw(im)
          d.rounded_rectangle((62, 95, 450, 395), radius=52, outline=(185, 157, 255), width=18)
          d.rounded_rectangle((88, 121, 424, 369), radius=30, fill=(28, 23, 58))
          d.ellipse((210, 172, 302, 264), fill=(237, 49, 89))
          d.polygon([(247, 193), (247, 243), (286, 218)], fill=(255,255,255))
          d.rounded_rectangle((178, 414, 334, 438), radius=12, fill=(185,157,255))
          im.save("webos/icon.png", "PNG", optimize=True)
          PY

      - name: Validate webOS app metadata
        run: |
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path("webos")
          info = json.loads((root / "appinfo.json").read_text())
          assert info["id"] and info["main"] and info["icon"]
          for key in ("main", "icon", "largeIcon"):
              assert (root / info[key]).is_file(), f"Missing {key}: {info[key]}"
          assert (root / "index.html").is_file()

          # Keep every screen/control and JavaScript function from the canonical app.
          import re
          canonical = pathlib.Path("ashika_live_tv.html").read_text()
          webos = (root / "index.html").read_text()
          ids = lambda source: set(re.findall(r"""\bid=["']([^"']+)["']""", source))
          funcs = lambda source: set(re.findall(r"function\s+([A-Za-z_$][\w$]*)\s*\(", source))
          missing_ids = ids(canonical) - ids(webos)
          missing_funcs = funcs(canonical) - funcs(webos)
          assert not missing_ids, f"Missing UI elements: {sorted(missing_ids)}"
          assert not missing_funcs, f"Missing app functions: {sorted(missing_funcs)}"
          required_features = ["epgPanel", "sportsPanel", "subtitleSelect", "audioSelect"]
          for feature in required_features:
              assert feature in webos, f"Missing webOS feature: {feature}"
          for fn in ("ashikaLoadEpg", "ashikaParseXmltv", "ashikaSelectSubtitle", "ashikaSelectAudio"):
              assert ("function " + fn + "(") in webos, f"Missing feature function: {fn}"
          assert "video.canPlayType" in webos, "Native HLS-first playback fallback is missing"
          required_features = ["epgPanel", "sportsPanel", "toffeePanel", "subtitleSelect", "audioSelect", "miniPipBtn", "backupFile"]
          for feature in required_features:
              assert feature in webos, f"Missing webOS feature: {feature}"
          for fn in ("ashikaLoadEpg", "ashikaParseXmltv", "ashikaSelectSubtitle", "ashikaSelectAudio", "ashikaToggleMiniPip", "ashikaExportBackup", "ashikaImportBackup", "ashikaExtractToffeeInput", "ashikaFetchToffee", "ashikaParseJsonPlaylist", "ashikaParseHeaderQuery"):
              assert ("function " + fn + "(") in webos, f"Missing feature function: {fn}"
          assert "video.canPlayType" in webos and "xhr.setRequestHeader" in webos, "Native HLS / header-aware HLS playback is missing"
          # Parse every inline JavaScript block to catch syntax errors before packaging.
          import subprocess, tempfile
          scripts = re.findall(r"<script\b(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>", webos, re.I)
          for index, script in enumerate(scripts):
              if not script.strip():
                  continue
              js_file = pathlib.Path(tempfile.gettempdir()) / f"ashika-webos-{index}.js"
              js_file.write_text(script)
              subprocess.run(["node", "--check", str(js_file)], check=True)
          print(f"Parity checks passed: {len(ids(canonical))} baseline UI IDs, {len(funcs(canonical))} baseline functions, {len(scripts)} inline JS blocks syntax-checked; webOS EPG/sports/Toffee/backup/PiP/header-HLS checks passed")
          print("Validated:", info["id"], info["version"])
          PY

      - name: Package IPK
        run: |
          mkdir -p dist
          ares-config --profile tv
          ares-package --no-minify --outdir dist webos
          test -s dist/com.ashika.livetv_9.3.0_all.ipk
          ares-package --info dist/com.ashika.livetv_9.3.0_all.ipk

      - name: Verify packaged IPK contents
        run: |
          python - <<'PY'
          import io, pathlib, subprocess, tarfile
          package = pathlib.Path("dist/com.ashika.livetv_9.3.0_all.ipk")
          members = subprocess.check_output(["ar", "t", str(package)], text=True).splitlines()
          data_name = next((name for name in members if name.startswith("data.tar")), None)
          assert data_name, f"No application payload found in IPK: {members}"
          payload = subprocess.check_output(["ar", "p", str(package), data_name])
          with tarfile.open(fileobj=io.BytesIO(payload), mode="r:*") as archive:
              files = {pathlib.PurePosixPath(item.name).name: item for item in archive.getmembers() if item.isfile()}
              for required in ("index.html", "appinfo.json", "icon.png"):
                  assert required in files, f"Missing {required} inside IPK"
              assert files["index.html"].size >= 40000, "Packaged app HTML is unexpectedly incomplete"
              print("IPK payload verified:", {name: files[name].size for name in ("index.html", "appinfo.json", "icon.png")})
          print("Final IPK bytes:", package.stat().st_size)
          PY

      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ashika-TV-webOS-IPK-v9.3.0
          path: dist/*.ipk
          retention-days: 90

      - name: Publish webOS IPK release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: webos-v9.3.0
          target_commitish: main
          name: Ashika TV webOS v9.3.0
          generate_release_notes: true
          files: dist/*.ipk

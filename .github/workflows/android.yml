name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare debug signing key
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Run unit tests
        run: |
          for attempt in 1 2 3; do
            echo "Running unit tests (attempt $attempt/3)"
            if gradle --no-daemon testDebugUnitTest; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Unit tests failed; retrying in 15 seconds (Robolectric may need to fetch Android artifacts)."
              sleep 15
            fi
          done
          echo "Unit tests failed after 3 attempts."
          exit 1

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ashika-tv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ashika-tv-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

name: Ashika TV Release

on:
  push:
    branches:
      - main
    paths:
      - "app/build.gradle.kts"
  workflow_dispatch:
    inputs:
      version:
        description: "Public release version (example: 6.2.0)"
        required: true
        default: "6.3.1"
        type: string

permissions:
  contents: write

concurrency:
  group: ashika-tv-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            [[ "$VERSION" == v* ]] || VERSION="v$VERSION"
          else
            VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
            if [ -z "$VERSION" ]; then
              echo "Could not read versionName from app/build.gradle.kts"
              exit 1
            fi
            [[ "$VERSION" == v* ]] || VERSION="v$VERSION"
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Decode Android release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing repository secret: KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p app
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/upload-key.jks
          test -s app/upload-key.jks

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Missing repository secrets: STORE_PASSWORD and/or KEY_PASSWORD"
            exit 1
          fi
          gradle --no-daemon clean assembleRelease
          mkdir -p release
          cp app/build/outputs/apk/release/*.apk "release/Ashika-TV-$RELEASE_TAG.apk"

      - name: Verify APK alignment, package metadata, and signature
        shell: bash
        run: |
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          APK="release/Ashika-TV-$VERSION.apk"
          test -s "$APK"
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          PACKAGE="$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$APK")"
          test "$PACKAGE" = "com.aistudio.ashikatv.rmtvyq"
          echo "Verified install package: $PACKAGE"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ashika-TV-release-${{ steps.release.outputs.tag }}
          path: release/*.apk
          retention-days: 90

      - name: Publish public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: main
          name: Ashika TV ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: release/*.apk

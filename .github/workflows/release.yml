name: Ashika TV Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ashika-tv-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode Android release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing repository secret: KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p app
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/upload-key.jks
          test -s app/upload-key.jks

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Missing repository secrets: STORE_PASSWORD and/or KEY_PASSWORD"
            exit 1
          fi
          gradle --no-daemon clean assembleRelease
          mkdir -p release
          cp app/build/outputs/apk/release/*.apk "release/Ashika-TV-${GITHUB_REF_NAME}.apk"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ashika-TV-release-${{ github.ref_name }}
          path: release/*.apk
          retention-days: 90

      - name: Publish public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Ashika TV ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: release/*.apk
